    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" rx="228" fill="url(#tile)"/>
  <rect id="rim" x="4" y="4" width="1016" height="1016" rx="224" fill="none" stroke="url(#keyline)" stroke-width="8"/>
  <g id="record">
