<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">IT-Feels IF music icon</title>
  <desc id="description">An ivory I and mint F shaped into musical notes over an engraved vinyl record.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#37675B"/>
      <stop offset=".43" stop-color="#193A34"/>
      <stop offset="1" stop-color="#071713"/>
    </linearGradient>
    <linearGradient id="keyline" x2=".72" y2="1">
      <stop stop-color="#8CCAB5" stop-opacity=".78"/>
      <stop offset=".48" stop-color="#5A9382" stop-opacity=".23"/>
      <stop offset="1" stop-color="#6BAB94" stop-opacity=".39"/>
    </linearGradient>
    <radialGradient id="vinyl" cx=".34" cy=".26" r=".79">
      <stop stop-color="#243934"/>
      <stop offset=".55" stop-color="#101F1C"/>
      <stop offset="1" stop-color="#060E0D"/>
    </radialGradient>
    <linearGradient id="groove" x2="1" y2="1">
      <stop stop-color="#95CBBC" stop-opacity=".48"/>
      <stop offset=".36" stop-color="#71A796" stop-opacity=".10"/>
      <stop offset=".65" stop-color="#71A796" stop-opacity=".05"/>
      <stop offset="1" stop-color="#75AB9B" stop-opacity=".29"/>
    </linearGradient>
    <linearGradient id="mint" x2=".44" y2="1">
