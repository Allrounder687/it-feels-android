      <circle cx="512" cy="510" r="384"/>
      <circle cx="512" cy="510" r="365"/>
      <circle cx="512" cy="510" r="345"/>
      <circle cx="512" cy="510" r="323"/>
      <circle cx="512" cy="510" r="302"/>
