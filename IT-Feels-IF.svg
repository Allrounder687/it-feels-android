    <path id="letter-f" fill="url(#mint)" d="M548 282H792Q810 282 801 298L772 349Q765 361 750 361H618V429H748Q762 429 762 443V490Q762 504 748 504H618V616C618 670 575 711 519 724C469 736 433 714 433 677C433 636 468 600 516 586C522 584 528 583 534 582V296Q534 282 548 282Z"/>
