compatibility_date = "2024-03-01"

# You will need to create this KV namespace in your Cloudflare dashboard and update the ID
# e.g., run: npx wrangler kv:namespace create "STREAM_CACHE"
kv_namespaces = [
  { binding = "STREAM_CACHE", id = "d4b369d4dfb54b4d9b20c3b544927e51" }
]

[vars]
