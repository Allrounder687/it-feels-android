  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#090D16"
    theme_color: "#090D16"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#090D16"
  adaptive_icon_foreground: "assets/icon.png"

msix_config:
  display_name: IT Feels Music
  publisher_display_name: Allrounder687
  identity_name: com.allrounder687.itfeels
  publisher: CN=Allrounder687, O=Allrounder687, C=US
  logo_path: assets/icon.png
  executable_name: it_feels_music.exe
  architecture: x64
  capabilities: internetClient
  protocol_activation: itfeels
  file_extension: .mp3, .flac, .m4a
  store: false
  install_certificate: false

dependency_overrides:
  flutter_rust_bridge: 2.11.1

inno_bundle:
  id: c19c6370-959a-11f1-a276-93f701066dd6
