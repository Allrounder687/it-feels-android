name: Performance & Quality Gates

on:
  push:
    branches: [ main, master, patch-video-fixes ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: flutter pub get

      - name: Strict Static Analysis (Detects Leaks & Race Conditions)
        run: dart analyze --fatal-warnings

      - name: Create dummy .env for tests
        run: touch .env

      - name: Check for Widget Tests (Performance Regressions)
        run: flutter test --no-pub
