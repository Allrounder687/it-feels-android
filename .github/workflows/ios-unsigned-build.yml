name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'ios-v*'

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
          
      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          
          # Initialize Shorebird Flutter SDK so files exist
          shorebird flutter --version
          
          # Patch Flutter SDK SPM generator to force iOS 15.0 deployment target instead of hardcoded 13.0
          echo "Patching Flutter SDK SPM minimum iOS deployment target to 15.0..."
          find "$FLUTTER_ROOT" -type f -name "*.dart" -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find "$FLUTTER_ROOT" -type f -name "*.dart" -exec sed -i '' "s/'13\.0'/'15\.0'/g" {} + || true
          find "$FLUTTER_ROOT" -type f -name "*.tmpl" -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          # Force rebuild of flutter_tools
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"

          # Patch Shorebird's vendored Flutter SDK (Crucial for `shorebird release ios`)
          echo "Patching Shorebird vendored Flutter SDK SPM minimum iOS deployment target to 15.0..."
          find "$HOME/.shorebird" -type f -name "*.dart" -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find "$HOME/.shorebird" -type f -name "*.dart" -exec sed -i '' "s/'13\.0'/'15\.0'/g" {} + || true
          find "$HOME/.shorebird" -type f -name "*.tmpl" -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          # Force rebuild of Shorebird's flutter_tools
          find "$HOME/.shorebird" -type f -name "flutter_tools.stamp" -exec rm -f {} + || true
          find "$HOME/.shorebird" -type f -name "flutter_tools.snapshot" -exec rm -f {} + || true
          
          # Rebuild tools
          flutter --version
          shorebird flutter --version
          
          flutter clean
          flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate Firebase Options
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/firebase_options.dart
          // File generated by FlutterFire CLI.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                case TargetPlatform.macOS:
                  return macos;
                case TargetPlatform.windows:
                  return windows;
                default:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions are not supported for this platform.',
                  );
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: 'AIza' 'SyBuzNmgNgtMgE7SGZn86jjpTx8ja0Y5la0',
              appId: '1:871513419979:web:537df62b89b620e3dcab4e',
              messagingSenderId: '871513419979',
              projectId: 'it-feels',
              authDomain: 'it-feels.firebaseapp.com',
              databaseURL: 'https://it-feels-default-rtdb.asia-southeast1.firebasedatabase.app',
              storageBucket: 'it-feels.firebasestorage.app',
              measurementId: 'G-3V8VKQK10M',
            );

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIza' 'SyBs3YpqQXYA4xUHYeV9ZzrkvypVr2alXn0',
              appId: '1:871513419979:android:09cf99d8f828f51edcab4e',
              messagingSenderId: '871513419979',
              projectId: 'it-feels',
              databaseURL: 'https://it-feels-default-rtdb.asia-southeast1.firebasedatabase.app',
              storageBucket: 'it-feels.firebasestorage.app',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: 'AIza' 'SyDrX6fCTOLqKkx4aeXhXqqfHOuJOP8N4vQ',
              appId: '1:871513419979:ios:4e2edbe14ef3f5cbdcab4e',
              messagingSenderId: '871513419979',
              projectId: 'it-feels',
              databaseURL: 'https://it-feels-default-rtdb.asia-southeast1.firebasedatabase.app',
              storageBucket: 'it-feels.firebasestorage.app',
              iosClientId: '871513419979-0116coptppjehfnkjeogq5s4bmdv7184.apps.googleusercontent.com',
              iosBundleId: 'com.itfeels.music',
            );

            static const FirebaseOptions macos = FirebaseOptions(
              apiKey: 'AIza' 'SyDrX6fCTOLqKkx4aeXhXqqfHOuJOP8N4vQ',
              appId: '1:871513419979:ios:2c1d2929c216f080dcab4e',
              messagingSenderId: '871513419979',
              projectId: 'it-feels',
              databaseURL: 'https://it-feels-default-rtdb.asia-southeast1.firebasedatabase.app',
              storageBucket: 'it-feels.firebasestorage.app',
              iosClientId: '871513419979-iue97ao88vmd7eqbjmvb8sc585ollhqj.apps.googleusercontent.com',
              iosBundleId: 'com.pixelplayer.saavn.pixelPlayerSaavn',
            );

            static const FirebaseOptions windows = FirebaseOptions(
              apiKey: 'AIza' 'SyBuzNmgNgtMgE7SGZn86jjpTx8ja0Y5la0',
              appId: '1:871513419979:web:b6243f7278442970dcab4e',
              messagingSenderId: '871513419979',
              projectId: 'it-feels',
              authDomain: 'it-feels.firebaseapp.com',
              databaseURL: 'https://it-feels-default-rtdb.asia-southeast1.firebasedatabase.app',
              storageBucket: 'it-feels.firebasestorage.app',
              measurementId: 'G-FWN1NHL61X',
            );
          }
          EOF


      - name: Build iOS without Code Signing
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # 1. Ensure xcconfig contains DEVELOPMENT_TEAM & Code Signing overrides
          for conf in Release Debug Profile Generated; do
            if [ -f "ios/Flutter/$conf.xcconfig" ]; then
              echo "DEVELOPMENT_TEAM=A1B2C3D4E5" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGNING_ALLOWED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGNING_REQUIRED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGN_IDENTITY=" >> "ios/Flutter/$conf.xcconfig"
              echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "ios/Flutter/$conf.xcconfig"
              echo "IPHONEOS_DEPLOYMENT_TARGET=15.0" >> "ios/Flutter/$conf.xcconfig"
            fi
          done

          # 2. Install CocoaPods dependencies & Generate SPM Package
          flutter build ios --config-only
          
          cd ios
          pod install
          cd ..
          
          # 3. FORCE SPM Package.swift to iOS 15 (Fix for Flutter 3.24+ hardcoding 13.0)
          echo "Finding and patching Package.swift files..."
          find . -name "Package.swift" -type f -exec sed -i '' 's/"12\.0"/"15\.0"/g' {} + || true
          find . -name "Package.swift" -type f -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find . -name "Package.swift" -type f -exec sed -i '' 's/"14\.0"/"15\.0"/g' {} + || true
          find /Users/runner -name "Package.swift" -type f -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find . -name "Package.swift" -type f -exec cat {} + || true
          
          # 4. Re-inject into xcconfig in case flutter build rewrote them
          for conf in Release Debug Profile Generated; do
            if [ -f "ios/Flutter/$conf.xcconfig" ]; then
              echo "IPHONEOS_DEPLOYMENT_TARGET=15.0" >> "ios/Flutter/$conf.xcconfig"
            fi
          done
          
          # BACKUP: Standard Flutter build (in case Shorebird causes issues)
          # flutter build ios --release --no-codesign
          
          # 4. Build Release iOS app without code signing using Shorebird (fallback to standard flutter build if release exists)
          shorebird release ios --no-codesign || flutter build ios --release --no-codesign
          # 4. Fallback Native Xcode Build if needed
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            cd ios
            xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="A1B2C3D4E5" build
            cd ..
          fi


      - name: Install ldid
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install ldid

      - name: Package and Pseudo-sign into IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Build likely failed."
            exit 1
          fi
          mkdir -p Payload
          mv "$APP_PATH" Payload/
          
          # CRITICAL: Pseudo-sign the binary so it doesn't get Killed: 9
          ldid -S Payload/Runner.app/Runner
          
          # Sign all embedded frameworks
          find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read framework; do
            framework_name=$(basename "$framework" .framework)
            if [ -f "$framework/$framework_name" ]; then
              ldid -S "$framework/$framework_name"
            fi
          done
          
          # Sign any dylibs
          find Payload/Runner.app -name "*.dylib" -type f | while read dylib; do
            ldid -S "$dylib"
          done
          
          zip -r IT-Feels.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IT-Feels-iOS.ipa
          path: IT-Feels.ipa

      - name: Generate QR Code for Action Summary
        run: |
          URL="trollstore://install?url=https://github.com/${{ github.repository }}/releases/download/nightly/IT-Feels.ipa"
          ENCODED_URL=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$URL")
          # We use a public QR code API to render the TrollStore URL in the summary
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${ENCODED_URL}"
          
          echo "### 📲 Install on iPad (TrollStore)" >> $GITHUB_STEP_SUMMARY
          echo "**Tap this link from your iPad:** [Install Latest Build]($URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Or scan this QR Code using your iPad camera:**" >> $GITHUB_STEP_SUMMARY
          echo "<br><img src=\"$QR_URL\" width=\"250\" height=\"250\">" >> $GITHUB_STEP_SUMMARY

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Latest Nightly Build"
          body: |
            This is the latest auto-generated build.
            
            [📲 **Tap here to Install via TrollStore**](trollstore://install?url=https://github.com/${{ github.repository }}/releases/download/nightly/IT-Feels.ipa)
            
            *(Note: If you are on a computer, scan the QR code found in the [Actions Summary](https://github.com/${{ github.repository }}/actions) page)*
          files: IT-Feels.ipa
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
