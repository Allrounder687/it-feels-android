name: iOS Unsigned Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - it-feels-branch

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without Code Signing
        run: |
          # 1. Generate Podfile (ignore code sign errors)
          flutter build ios --release --no-codesign || true
          
          # 2. Inject Code Signing overrides into Podfile
          cat << 'EOF' > patch_podfile.rb
          require 'fileutils'
          content = File.read('ios/Podfile')
          new_content = content.gsub(/flutter_additional_ios_build_settings\(target\)/, "flutter_additional_ios_build_settings(target)\n      target.build_configurations.each do |config|\n        config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n        config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n        config.build_settings['CODE_SIGN_IDENTITY'] = '-'\n        config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = '-'\n        config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'\n        config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'\n      end")
          File.write('ios/Podfile', new_content)
          EOF
          ruby patch_podfile.rb
          
          # 3. Install Pods
          cd ios
          pod install
          cd ..
          
          # 4. Generate AOT (ignore code sign errors)
          flutter build ios --release --no-codesign || true
          
          # 5. Native Xcode Build (Force signing disabled)
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          cd ..

      - name: Install ldid
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: brew install ldid

      - name: Package and Pseudo-sign into IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Build likely failed."
            exit 1
          fi
          mkdir -p Payload
          mv "$APP_PATH" Payload/
          
          # CRITICAL: Pseudo-sign the binary so it doesn't get Killed: 9
          ldid -S Payload/Runner.app/Runner
          
          # Sign all embedded frameworks
          find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read framework; do
            framework_name=$(basename "$framework" .framework)
            if [ -f "$framework/$framework_name" ]; then
              ldid -S "$framework/$framework_name"
            fi
          done
          
          # Sign any dylibs
          find Payload/Runner.app -name "*.dylib" -type f | while read dylib; do
            ldid -S "$dylib"
          done
          
          zip -r IT-Feels.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IT-Feels-iOS.ipa
          path: IT-Feels.ipa

      - name: Generate QR Code for Action Summary
        run: |
          URL="trollstore://install?url=https://github.com/${{ github.repository }}/releases/download/nightly/IT-Feels.ipa"
          ENCODED_URL=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$URL")
          # We use a public QR code API to render the TrollStore URL in the summary
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${ENCODED_URL}"
          
          echo "### 📲 Install on iPad (TrollStore)" >> $GITHUB_STEP_SUMMARY
          echo "**Tap this link from your iPad:** [Install Latest Build]($URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Or scan this QR Code using your iPad camera:**" >> $GITHUB_STEP_SUMMARY
          echo "<br><img src=\"$QR_URL\" width=\"250\" height=\"250\">" >> $GITHUB_STEP_SUMMARY

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Latest Nightly Build"
          body: |
            This is the latest auto-generated build.
            
            [📲 **Tap here to Install via TrollStore**](trollstore://install?url=https://github.com/${{ github.repository }}/releases/download/nightly/IT-Feels.ipa)
            
            *(Note: If you are on a computer, scan the QR code found in the [Actions Summary](https://github.com/${{ github.repository }}/actions) page)*
          files: IT-Feels.ipa
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
