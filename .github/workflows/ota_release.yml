name: OTA Release Pipeline

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v3.3.0
      - 'android-v*'

jobs:
  build-and-release:
    name: Build, Release, and Trigger OTA
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Create Dummy Env File
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > android/app/key.jks

      - name: Build Shorebird Release (APK)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release android --artifact apk || (flutter clean && flutter build apk --release)

      - name: Rename APK file
        run: mv build/app/outputs/flutter-apk/app-release.apk it-feels-android-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: it-feels-android-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Extract Version Info from Pubspec
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          # VERSION format: 3.2.0+9
          VERSION_NAME=$(echo $VERSION | cut -d '+' -f 1)
          VERSION_CODE=$(echo $VERSION | cut -d '+' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Setup Node.js for Firebase Script
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Firebase Admin
        working-directory: .github/scripts
        run: npm init -y && npm install firebase-admin

      - name: Trigger Firebase OTA Update
        working-directory: .github/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          LATEST_VERSION: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/it-feels-android-${{ github.ref_name }}.apk
          RELEASE_NOTES: "Version ${{ env.VERSION_NAME }} is now available. This mandatory update brings new features, stability improvements, and bug fixes."
        run: node update_firestore.js
