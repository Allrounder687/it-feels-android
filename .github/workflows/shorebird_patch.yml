name: Shorebird Patch Pipeline

on:
  push:
    branches:
      - 'patch-*'
    tags:
      - 'patch-v*'

jobs:
  patch-android:
    name: Build and Release Patch (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Create Dummy Env File
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo $KEYSTORE_BASE64 | base64 --decode > android/app/key.jks

      - name: Publish Shorebird Patch or Release (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if ! shorebird patch android --allow-native-diffs --allow-asset-diffs; then
            echo "Patch failed (likely release not found), creating a new release instead..."
            shorebird release android
          fi

  patch-ios:
    name: Build and Release Patch (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Create Dummy Env File
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Publish Shorebird Patch or Release (iOS)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # 1. Ensure xcconfig contains DEVELOPMENT_TEAM & Code Signing overrides
          for conf in Release Debug Profile Generated; do
            if [ -f "ios/Flutter/$conf.xcconfig" ]; then
              echo "DEVELOPMENT_TEAM=A1B2C3D4E5" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGNING_ALLOWED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGN_REQUIRED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGNING_REQUIRED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGN_IDENTITY=" >> "ios/Flutter/$conf.xcconfig"
              echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "ios/Flutter/$conf.xcconfig"
              echo "IPHONEOS_DEPLOYMENT_TARGET=15.0" >> "ios/Flutter/$conf.xcconfig"
            fi
          done

          # 2. Install CocoaPods dependencies & Generate SPM Package
          flutter build ios --config-only
          
          cd ios
          pod install
          cd ..
          
          # 3. FORCE SPM Package.swift to iOS 15
          find ios .symlinks -name "Package.swift" -type f -exec sed -i '' 's/"12\.0"/"15\.0"/g' {} + || true
          find ios .symlinks -name "Package.swift" -type f -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find ios .symlinks -name "Package.swift" -type f -exec sed -i '' 's/"14\.0"/"15\.0"/g' {} + || true
          
          if ! shorebird patch ios --no-codesign --allow-native-diffs --allow-asset-diffs; then
            echo "Patch failed (likely release not found), creating a new release instead..."
            shorebird release ios --no-codesign
          fi
