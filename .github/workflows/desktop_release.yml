name: Desktop Release Pipeline

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'

jobs:
  build-windows-msix:
    name: Build Windows MSIX
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy Env File
        run: New-Item -Path .env -ItemType File -Force

      - name: Install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Extract Version Quadruplet
        id: version
        shell: powershell
        run: |
          $raw = (Get-Content pubspec.yaml | Select-String "^version:").Line.Split(" ")[1].Trim()
          $semver = $raw.Split("+")[0]
          $quad = "$semver.0"
          $tag = "${{ github.ref_name }}"
          Write-Output "QUAD_VERSION=$quad" >> $env:GITHUB_OUTPUT
          Write-Output "SEMVER=$semver" >> $env:GITHUB_OUTPUT
          Write-Output "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Build Inno Setup Installer
        run: |
          mkdir -p build/windows/x64/installer
          iscc /DMyAppVersion="${{ steps.version.outputs.SEMVER }}" windows/packaging/installer.iss

      - name: Copy Unsigned EXE for Dev Artifact
        shell: powershell
        run: |
          Copy-Item "build\windows\x64\installer\ITFeelsMusic_Installer.exe" "ItFeels-Windows-x64-unsigned.exe"

      # --- Optional SignPath Foundation Signing ---
      - name: Upload Unsigned EXE for Signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: build/windows/x64/installer/ITFeelsMusic_Installer.exe

      - name: Submit to SignPath Foundation
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
          project-slug: 'it-feels-android'
          signing-policy-slug: 'release-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed-output'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

      # --- Prepare Final EXE (signed or unsigned) ---
      - name: Resolve Final EXE
        shell: powershell
        run: |
          if (Test-Path "signed-output\ITFeelsMusic_Installer.exe") {
            Write-Host "Using SignPath-signed EXE"
            Copy-Item "signed-output\ITFeelsMusic_Installer.exe" "ItFeels-Windows-x64-Setup.exe"
          } else {
            Write-Host "Using unsigned EXE (no signing secret configured)"
            Copy-Item "build\windows\x64\installer\ITFeelsMusic_Installer.exe" "ItFeels-Windows-x64-Setup.exe"
          }

      # --- SHA-256 Checksums ---
      - name: Generate SHA-256 Checksums
        shell: powershell
        run: |
          $files = @(
            "ItFeels-Windows-x64-Setup.exe",
            "ItFeels-Windows-x64-unsigned.exe"
          )
          $checksums = @()
          foreach ($f in $files) {
            if (Test-Path $f) {
              $hash = (Get-FileHash $f -Algorithm SHA256).Hash
              $checksums += "$hash  $f"
            }
          }
          $checksums | Set-Content -Path "SHA256SUMS-windows.txt"

      # --- Upload to GitHub Release ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ItFeels-Windows-x64-Setup.exe
            ItFeels-Windows-x64-unsigned.exe
            SHA256SUMS-windows.txt
          generate_release_notes: false

  build-macos:
    name: Build MacOS Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy Env File
        run: touch .env

      - name: Install dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build MacOS
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          create-dmg \
            --volname "IT Feels" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 190 \
            "../../../../../it-feels-macos-${{ github.ref_name }}.dmg" \
            "pixel_player_saavn.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: it-feels-macos-${{ github.ref_name }}.dmg
          generate_release_notes: false
