name: Desktop Release Pipeline

on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy Env File
        run: New-Item -Path .env -ItemType File -Force

      - name: Install dependencies
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Release
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath it-feels-windows-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: it-feels-windows-${{ github.ref_name }}.zip
          generate_release_notes: false

  build-macos:
    name: Build MacOS Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy Env File
        run: touch .env

      - name: Install dependencies
        run: |
          flutter config --enable-macos-desktop
          flutter pub get

      - name: Build MacOS
        run: flutter build macos --release

      - name: Zip Release
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../it-feels-macos-${{ github.ref_name }}.zip *.app
          cd ../../../../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: it-feels-macos-${{ github.ref_name }}.zip
          generate_release_notes: false
