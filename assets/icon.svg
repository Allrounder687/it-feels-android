<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Deep Cosmic Obsidian Background with Music Nebula Glow -->
    <radialGradient id="musicBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1A102A" />
      <stop offset="40%" stop-color="#100B1C" />
      <stop offset="75%" stop-color="#090610" />
      <stop offset="100%" stop-color="#040307" />
    </radialGradient>

    <!-- Vibrant Music Plasma Aura Glow -->
    <radialGradient id="musicAura" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#8A2BE2" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Liquid Titanium Monogram Gradient -->
    <linearGradient id="titaniumSheen" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#F4F4F8" />
      <stop offset="50%" stop-color="#D1D5DB" />
      <stop offset="80%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <!-- Specular Edge Highlight -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#E0E7FF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Neon Acoustic Gradient for F Center Play Wing -->
    <linearGradient id="musicHarmonic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Drop Shadow & Neon Bloom Filters -->
    <filter id="monogramShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#8A2BE2" flood-opacity="0.45" />
    </filter>

    <filter id="harmonicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FF007F" flood-opacity="0.60" />
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00F0FF" flood-opacity="0.50" />
    </filter>

    <!-- Glassmorphic Top Dome Sheen -->
    <linearGradient id="topDomeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Layer 1: Squircle Base Chassis -->
  <g id="layer-background">
    <rect width="1024" height="1024" rx="225" fill="url(#musicBg)" />
    <!-- Outer Rim Bevel -->
    <rect x="3" y="3" width="1018" height="1018" rx="223" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3" />
    <rect x="6" y="6" width="1012" height="1012" rx="220" fill="none" stroke="#A855F7" stroke-opacity="0.30" stroke-width="1.5" />
  </g>

  <!-- Layer 2: Radiant Acoustic Plasma Aura -->
  <g id="layer-aura">
    <circle cx="512" cy="512" r="410" fill="url(#musicAura)" />
  </g>

  <!-- Layer 3: Concentric Vinyl Record Grooves & Resonant Sound Waves -->
  <g id="layer-vinyl-grooves">
    <circle cx="512" cy="512" r="380" stroke="#A855F7" stroke-opacity="0.14" stroke-width="2" />
    <circle cx="512" cy="512" r="330" stroke="#FF007F" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="14 8" />
    <circle cx="512" cy="512" r="280" stroke="#00F0FF" stroke-opacity="0.16" stroke-width="2" />
    <circle cx="512" cy="512" r="230" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="6 6" />
    <!-- Acoustic Pulse Points -->
    <circle cx="512" cy="132" r="3.5" fill="#00F0FF" opacity="0.7" />
    <circle cx="512" cy="892" r="3.5" fill="#FF007F" opacity="0.7" />
    <circle cx="132" cy="512" r="3.5" fill="#A855F7" opacity="0.7" />
    <circle cx="892" cy="512" r="3.5" fill="#00F0FF" opacity="0.7" />
  </g>

  <!-- Layer 4: Sovereign "I F" Monogram -->
  <g id="layer-monogram" filter="url(#monogramShadow)">
    <!-- "I" Pillar (Left Monolith Blade) -->
    <!-- d: Top-Left (220, 310) -> Top-Right (360, 230) -> Bottom-Right (360, 750) -> Bottom-Left (220, 830) -->
    <path d="M 220 310 L 360 230 L 360 750 L 220 830 Z"
          fill="url(#titaniumSheen)" stroke="url(#specularRim)" stroke-width="4.5" stroke-linejoin="round" />

    <!-- "F" Pillar (Vertical Stem + Top Arm of F) -->
    <!-- Stem: x=430 to 560, y=200 to 840 -->
    <!-- Top Arm of F: extends from x=430 to x=825, y=200 to 330 -->
    <path d="M 430 200 L 825 285 L 785 400 L 570 348 L 570 840 L 430 765 Z"
          fill="url(#titaniumSheen)" stroke="url(#specularRim)" stroke-width="4.5" stroke-linejoin="round" />
  </g>

  <!-- Layer 5: "F" Middle Harmonic Wing (Acoustic Play Bar of the "F") -->
  <!-- Middle arm of the F: extends from stem x=510 out to x=740 with a play-triangle bevel and equalizer pulses! -->
  <g id="layer-f-middle-wing" filter="url(#harmonicGlow)">
    <!-- Middle cross-bar of F rendered as an illuminated kinetic harmonic wing -->
    <path d="M 490 470 L 735 525 L 685 625 L 490 575 Z"
          fill="url(#musicHarmonic)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />

    <!-- Equalizer frequency bars embedded in the F middle arm -->
    <rect x="520" y="500" width="7" height="45" rx="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="540" y="488" width="7" height="70" rx="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="560" y="496" width="7" height="54" rx="3.5" fill="#FFFFFF" opacity="0.95" />
    <rect x="580" y="510" width="7" height="30" rx="3.5" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Layer 6: Radiant Acoustic Waves Radiating from the "F" -->
  <g id="layer-acoustic-waves" opacity="0.85">
    <path d="M 770 470 A 80 80 0 0 1 770 585" fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 795 440 A 115 115 0 0 1 795 615" fill="none" stroke="#FF007F" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="14 6" />
  </g>

  <!-- Layer 7: Glassmorphic Specular Top Sheen Dome -->
  <g id="layer-top-sheen">
    <rect x="3" y="3" width="1018" height="350" rx="223" fill="url(#topDomeSheen)" />
  </g>
</svg>