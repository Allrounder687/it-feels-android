workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build (SideStore / TrollStore)
    max_build_duration: 35
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        TELEGRAM_BOT_TOKEN: "7977916547:AAET0iP-5DbTwlYlCAhBTtIwLS0e6ZAXdqM"
        TELEGRAM_CHAT_ID: "424256757"
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: Initialize Environment & Flutter SPM
        script: |
          touch .env
          flutter config --enable-swift-package-manager --no-analytics

          # Patch Flutter SDK SPM generator to enforce iOS 15.0 deployment target
          echo "Patching Flutter SDK SPM minimum deployment target to 15.0..."
          find "$FLUTTER_ROOT/packages/flutter_tools" -type f -name "*.dart" -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find "$FLUTTER_ROOT/packages/flutter_tools" -type f -name "*.tmpl" -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find "$FLUTTER_ROOT/packages/flutter_tools" -type f -name "*.dart" -exec sed -i '' "s/'13\.0'/'15\.0'/g" {} + || true
          find "$FLUTTER_ROOT/packages/flutter_tools" -type f -name "*.tmpl" -exec sed -i '' "s/'13\.0'/'15\.0'/g" {} + || true
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.stamp"
          rm -f "$FLUTTER_ROOT/bin/cache/flutter_tools.snapshot"
          flutter --version

          flutter pub get

      - name: Configure Xcode Signing Overrides & Pods
        script: |
          # Inject code signing overrides and iOS 15 target into xcconfig files
          for conf in Release Debug Profile Generated; do
            if [ -f "ios/Flutter/$conf.xcconfig" ]; then
              echo "DEVELOPMENT_TEAM=A1B2C3D4E5" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGNING_ALLOWED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGNING_REQUIRED=NO" >> "ios/Flutter/$conf.xcconfig"
              echo "CODE_SIGN_IDENTITY=" >> "ios/Flutter/$conf.xcconfig"
              echo "EXPANDED_CODE_SIGN_IDENTITY=" >> "ios/Flutter/$conf.xcconfig"
              echo "IPHONEOS_DEPLOYMENT_TARGET=15.0" >> "ios/Flutter/$conf.xcconfig"
            fi
          done

          # Fast pre-configuration of iOS project and SPM packages
          flutter build ios --config-only

          # Install Pods cleanly without repo update overhead
          cd ios
          pod install || pod install --repo-update
          cd ..

          # Force all generated Package.swift to iOS 15.0
          echo "Patching generated Package.swift files..."
          find ios .symlinks -name "Package.swift" -type f -exec sed -i '' 's/"12\.0"/"15\.0"/g' {} + || true
          find ios .symlinks -name "Package.swift" -type f -exec sed -i '' 's/"13\.0"/"15\.0"/g' {} + || true
          find ios .symlinks -name "Package.swift" -type f -exec sed -i '' 's/"14\.0"/"15\.0"/g' {} + || true

      - name: Build iOS Unsigned Release
        script: |
          # Build unsigned release application
          flutter build ios --release --no-codesign

      - name: Package & Pseudo-Sign IPA (TrollStore / Sideloading)
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/

          # Install ldid for pseudo-signing (prevents Killed: 9 crash on TrollStore)
          if ! command -v ldid &> /dev/null; then
            brew install ldid || true
          fi

          if command -v ldid &> /dev/null; then
            echo "Pseudo-signing executable and frameworks..."
            ldid -S Payload/Runner.app/Runner || true
            find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read framework; do
              framework_name=$(basename "$framework" .framework)
              if [ -f "$framework/$framework_name" ]; then
                ldid -S "$framework/$framework_name" || true
              fi
            done
            find Payload/Runner.app -name "*.dylib" -type f | while read dylib; do
              ldid -S "$dylib" || true
            done
          fi

          zip -qr9 ITFeels_Unsigned.ipa Payload
          cd ../../..

      - name: Dispatch IPA to Telegram Bot
        script: |
          IPA_PATH="build/ios/iphoneos/ITFeels_Unsigned.ipa"
          if [ -f "$IPA_PATH" ]; then
            APP_VER=$(grep "version:" pubspec.yaml | head -n 1 | awk '{print $2}')
            echo "Dispatching ITFeels_Unsigned.ipa (version $APP_VER) to Telegram..."
            curl -F "chat_id=$TELEGRAM_CHAT_ID" \
                 -F "document=@$IPA_PATH" \
                 -F "caption=🎵 IT Feels iOS Build%0A• Sideloadable IPA generated by Codemagic%0A• Version: $APP_VER%0A• Pseudo-signed for TrollStore / SideStore / AltStore / Scarlet%0A• Fast Mac mini M2 Pipeline" \
                 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" || true
          fi

      - name: Publish to GitHub Releases (Tags Only)
        script: |
          if [ -n "$CM_TAG" ] && [ -n "$GITHUB_TOKEN" ]; then
            gh release create "$CM_TAG" \
              --title "Release $CM_TAG" \
              --notes "Automated release from Codemagic" \
              build/ios/iphoneos/ITFeels_Unsigned.ipa || true
          else
            echo "Not a tagged build or GITHUB_TOKEN omitted. Skipping GitHub release."
          fi

    artifacts:
      - build/ios/iphoneos/ITFeels_Unsigned.ipa
      - "*.ipa"
